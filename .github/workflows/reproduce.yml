name: reproduce

# Full reproduction of every result (analysis/run_all.py --quick) with the
# Git LFS caches. Manual only, because each run downloads ~120 MB of LFS data.

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Reproduce all results
        run: python analysis/run_all.py --quick
      - name: Test
        run: pytest -q
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: |
            data/derived
            results
            logs
